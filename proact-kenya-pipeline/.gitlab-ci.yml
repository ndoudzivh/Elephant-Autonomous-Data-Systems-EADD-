# =============================================================================
# ProACT Kenya Pipeline - GitLab CI/CD
# =============================================================================
# Pipeline Flow (per diagram):
#   Import/Register (one-time, outside pipeline) triggers GitLab pipeline
#   GitLab pipeline: Preflight → Publish → Verify → Approve → Monitor
#
# Three model destinations:
#   - Simulation      (KE-model-sim)
#   - Scenario Planning (KE-model-scenpl)
#   - Operational     (KE-model-ops)
#
# Three environments:
#   - dev   (development / sandbox)
#   - uat   (user acceptance testing)
#   - prod  (production)
# =============================================================================

stages:
  - preflight
  - publish
  - verify
  - approve
  - monitor

# ---------------------------------------------------------------------------
# Global variables — override per environment via GitLab CI/CD settings
# ---------------------------------------------------------------------------
variables:
  SAS_VIYA_URL: "${SAS_VIYA_URL}"
  DENODO_DSN: "${DENODO_DSN}"
  DENODO_USER: "${DENODO_USER}"
  DENODO_PASSWORD: "${DENODO_PASSWORD}"
  SAS_USER: "${SAS_USER}"
  SAS_PASSWORD: "${SAS_PASSWORD}"
  # Model naming convention
  MODEL_PREFIX: "KE"
  # CAS library suffixes per environment
  CASLIB_SUFFIX: "${CASLIB_SUFFIX}"

# ---------------------------------------------------------------------------
# Reusable job templates (YAML anchors)
# ---------------------------------------------------------------------------
.sas_runner:
  tags:
    - proact
  before_script:
    - echo "Environment = ${CI_ENVIRONMENT_NAME}"
    - echo "Model Destination = ${MODEL_DESTINATION}"
    - echo "SAS Viya = ${SAS_VIYA_URL}"

.only_dev:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always

.only_uat:
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" || $CI_COMMIT_BRANCH =~ /^release\//'
      when: always

.only_prod:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

# =============================================================================
# DEV ENVIRONMENT
# =============================================================================

# --- SIMULATION (DEV) ---
preflight:simulation:dev:
  stage: preflight
  extends: .sas_runner
  environment:
    name: dev
  variables:
    MODEL_DESTINATION: "simulation"
    CAS_TABLE_NAME: "${MODEL_PREFIX}_model_simulation"
    CASLIB_NAME: "CAS_AR_CSE_Kenya_Dev"
  script:
    - echo "Running preflight checks for Simulation (Dev)"
    - powershell -File scripts/run_sas_program.ps1 -Program "sas/preflight/preflight_check.sas" -Env "dev" -Destination "simulation"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always

publish:simulation:dev:
  stage: publish
  extends: .sas_runner
  environment:
    name: dev
  variables:
    MODEL_DESTINATION: "simulation"
    CAS_TABLE_NAME: "${MODEL_PREFIX}_model_simulation"
    CASLIB_NAME: "CAS_AR_CSE_Kenya_Dev"
  script:
    - echo "Publishing model to Simulation CAS table (Dev)"
    - powershell -File scripts/run_sas_program.ps1 -Program "sas/publish/publish_simulation.sas" -Env "dev" -Destination "simulation"
  needs: ["preflight:simulation:dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always

verify:simulation:dev:
  stage: verify
  extends: .sas_runner
  environment:
    name: dev
  variables:
    MODEL_DESTINATION: "simulation"
    CAS_TABLE_NAME: "${MODEL_PREFIX}_model_simulation"
    CASLIB_NAME: "CAS_AR_CSE_Kenya_Dev"
  script:
    - echo "Running scoring verification for Simulation (Dev)"
    - powershell -File scripts/run_sas_program.ps1 -Program "sas/verify/verify_scoring.sas" -Env "dev" -Destination "simulation"
  needs: ["publish:simulation:dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always

approve:simulation:dev:
  stage: approve
  extends: .sas_runner
  environment:
    name: dev
  variables:
    MODEL_DESTINATION: "simulation"
  script:
    - echo "Governance gate - Simulation (Dev) approved"
  needs: ["verify:simulation:dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  allow_failure: false

