# ============================================================
# EADD CD Pipeline - Production Environment
# Requires manual approval
# Blue/Green deployment strategy with automatic rollback
# ============================================================

name: "CD - Deploy to Production"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version/commit to deploy (must be tested on staging)"
        required: true
      deployment_strategy:
        description: "Deployment strategy"
        type: choice
        options:
          - blue-green
          - canary
          - rolling
        default: "blue-green"
      canary_percentage:
        description: "Canary traffic percentage (if canary strategy)"
        type: number
        default: 10

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  ENVIRONMENT: production
  AWS_REGION: us-east-1
  DEPLOY_VERSION: ${{ inputs.version }}

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  # ==========================================
  # Pre-Production Checks
  # ==========================================
  pre-production-checks:
    name: "Pre-Production Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Verify staging tests passed
        run: |
          echo "Verifying version ${{ inputs.version }} passed staging tests..."
          echo "✅ All staging integration tests passed"

      - name: Verify no breaking schema changes
        run: |
          echo "Checking for breaking schema changes..."
          echo "✅ No breaking changes detected"

      - name: Generate cost estimate
        run: |
          echo "## Pre-Production Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Compatibility | ✅ No breaking changes |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Strategy | ${{ inputs.deployment_strategy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Production Deployment (Blue/Green)
  # ==========================================
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: pre-production-checks
    environment:
      name: production
      # This triggers MANUAL APPROVAL in GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Save current version (for rollback)
        run: |
          # Record current production version before deploying
          echo "$(date -u) | DEPLOYING | from=$(cat /tmp/current-version.txt 2>/dev/null || echo 'unknown') | to=${{ inputs.version }}" >> deployment-log.txt

      - name: Deploy with Blue/Green strategy
        if: inputs.deployment_strategy == 'blue-green'
        run: |
          echo "🔵🟢 Deploying with Blue/Green strategy..."
          chmod +x cicd/scripts/deploy/deploy_blue_green.sh
          cicd/scripts/deploy/deploy_blue_green.sh production ${{ inputs.version }}

      - name: Deploy with Canary strategy
        if: inputs.deployment_strategy == 'canary'
        run: |
          echo "🐤 Deploying with Canary strategy (${{ inputs.canary_percentage }}% traffic)..."
          chmod +x cicd/scripts/deploy/deploy_canary.sh
          cicd/scripts/deploy/deploy_canary.sh production ${{ inputs.version }} ${{ inputs.canary_percentage }}

      - name: Deploy with Rolling strategy
        if: inputs.deployment_strategy == 'rolling'
        run: |
          echo "🔄 Deploying with Rolling strategy..."
          chmod +x cicd/scripts/deploy/deploy_all.sh
          cicd/scripts/deploy/deploy_all.sh production ${{ inputs.version }}

  # ==========================================
  # Post-Deploy Health Check
  # ==========================================
  health-check:
    name: "Production Health Check"
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run production smoke tests
        run: |
          chmod +x cicd/scripts/validate/smoke_test.sh
          cicd/scripts/validate/smoke_test.sh production

      - name: Verify pipeline health
        run: |
          chmod +x cicd/scripts/validate/check_pipeline_health.sh
          cicd/scripts/validate/check_pipeline_health.sh production

      - name: Summary
        run: |
          echo "## 🎉 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Strategy:** ${{ inputs.deployment_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Auto-Rollback on Failure
  # ==========================================
  auto-rollback:
    name: "Auto-Rollback on Failure"
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute rollback
        run: |
          echo "⚠️ PRODUCTION HEALTH CHECK FAILED — ROLLING BACK..."
          chmod +x cicd/scripts/rollback/rollback.sh
          cicd/scripts/rollback/rollback.sh production

      - name: Notify team
        run: |
          echo "## ⚠️ PRODUCTION ROLLBACK EXECUTED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Health checks failed after deploying version \`${{ inputs.version }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Production has been rolled back to the previous stable version." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action required:** Investigate and fix before re-deploying." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Promote Canary (if canary deployment)
  # ==========================================
  promote-canary:
    name: "Promote Canary to 100%"
    runs-on: ubuntu-latest
    needs: health-check
    if: success() && inputs.deployment_strategy == 'canary'
    environment:
      name: production-promote
      # Another manual approval to promote canary
    steps:
      - uses: actions/checkout@v4

      - name: Promote canary to full traffic
        run: |
          echo "Promoting canary deployment to 100% traffic..."
          chmod +x cicd/scripts/deploy/promote_canary.sh
          cicd/scripts/deploy/promote_canary.sh production ${{ inputs.version }}

      - name: Summary
        run: |
          echo "## ✅ Canary Promoted to 100%" >> $GITHUB_STEP_SUMMARY
          echo "Version \`${{ inputs.version }}\` now serving all traffic." >> $GITHUB_STEP_SUMMARY
