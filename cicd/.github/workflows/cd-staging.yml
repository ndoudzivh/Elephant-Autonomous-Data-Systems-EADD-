# ============================================================
# EADD CD Pipeline - Staging Environment
# Requires manual approval before deployment
# Runs integration tests after deployment
# ============================================================

name: "CD - Deploy to Staging"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version/commit to deploy"
        required: true
        default: "latest"
      run_integration_tests:
        description: "Run integration tests after deploy"
        type: boolean
        default: true

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  ENVIRONMENT: staging
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  # ==========================================
  # Pre-deployment checks
  # ==========================================
  pre-deploy-checks:
    name: "Pre-Deployment Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI passed
        run: |
          echo "Checking CI status for commit ${{ github.sha }}..."
          # In production: check GitHub API for CI status
          echo "✅ CI checks passed"

      - name: Verify dev deployment succeeded
        run: |
          echo "Checking dev deployment status..."
          echo "✅ Dev deployment is healthy"

  # ==========================================
  # Deploy to Staging (all components)
  # ==========================================
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    environment:
      name: staging
      # This triggers manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy all components to staging
        run: |
          chmod +x cicd/scripts/deploy/deploy_all.sh
          cicd/scripts/deploy/deploy_all.sh staging ${{ github.sha }}

      - name: Record deployment version
        run: |
          echo "${{ github.sha }}" > /tmp/deployed-version.txt
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Integration Tests (post-deploy)
  # ==========================================
  integration-tests:
    name: "Integration Tests (Staging)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: inputs.run_integration_tests == true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest requests boto3 snowflake-connector-python

      - name: Run integration tests
        env:
          TEST_ENVIRONMENT: staging
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          cd cicd
          pytest tests/integration/ -v --tb=short --junitxml=reports/integration-tests.xml

      - name: Run data quality tests
        run: |
          cd cicd
          pytest tests/data_quality/ -v --tb=short

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: cicd/reports/

  # ==========================================
  # Rollback on failure
  # ==========================================
  rollback-on-failure:
    name: "Auto-Rollback (if tests fail)"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Rollback staging
        run: |
          echo "⚠️ Integration tests failed — rolling back staging..."
          chmod +x cicd/scripts/rollback/rollback.sh
          cicd/scripts/rollback/rollback.sh staging
          echo "## ⚠️ Staging Rolled Back" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests failed. Rolled back to previous version." >> $GITHUB_STEP_SUMMARY
